<!DOCTYPE html>
<html lang="en" class="scheme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Remy Kassim Photography</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">@theme { --font-sans: "Roboto Mono", monospace; }</style>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

  <!-- NAV -->
  <header class="sticky top-0 z-50 border-b border-slate-200 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 lg:px-8 h-24 w-full flex justify-between items-center">
      <a href="index.html" class="text-2xl font-light tracking-widest uppercase">Remy Kassim Photography</a>

      <nav class="flex items-center gap-6 text-sm font-medium">
        <a href="index.html" class="hover-underline-animation">Home</a>
        <div class="relative group">
          <a href="works.html" class="hover-underline-animation">Portfolio</a>
          <div class="absolute left-1/2 -translate-x-1/2 top-full pt-3 hidden group-hover:block">
            <div class="flex flex-col items-center gap-2 p-4 w-40 bg-black border border-slate-700 rounded-md">
              <a href="works.html#street" class="hover-underline-animation">Street</a>
              <a href="works.html#architecture" class="hover-underline-animation">Architecture</a>
              <a href="works.html#landscape" class="hover-underline-animation">Landscape</a>
            </div>
          </div>
        </div>
        <a href="index.html#services" class="hover-underline-animation">Services</a>
        <a href="contact.html" class="hover-underline-animation">Contact</a>
        <a href="https://www.instagram.com/remister35mm/" target="_blank" rel="noopener">
          <img class="w-[30px]" src="/images/ig.png" alt="Instagram">
        </a>
      </nav>
    </div>
  </header>

  <!-- CONTACT -->
  <main class="flex-grow py-20">
    <p class="text-3xl text-center mb-10">Get in touch</p>

    <form action="https://formspree.io/f/myeknpvn" method="POST"
          class="max-w-xl mx-auto flex flex-col gap-5 px-4">

      <!-- Subject line of the email you receive -->
      <input type="hidden" name="_subject" value="New enquiry from your photography site">

      <input type="text" name="name" placeholder="Name" required
             class="bg-transparent border border-slate-600 p-3 focus:border-white outline-none">

      <input type="email" name="email" placeholder="Email" required
             class="bg-transparent border border-slate-600 p-3 focus:border-white outline-none">

      <select name="type"
              class="bg-black border border-slate-600 p-3 focus:border-white outline-none">
        <option value="Event">Event</option>
        <option value="Real Estate">Real Estate</option>
        <option value="Portrait">Portrait</option>
        <option value="Other">Other</option>
      </select>

      <textarea name="message" rows="5" placeholder="Tell me about your shoot" required
                class="bg-transparent border border-slate-600 p-3 focus:border-white outline-none"></textarea>

      <button type="submit"
              class="border border-slate-600 py-3 tracking-widest uppercase text-sm cursor-pointer hover:bg-white hover:text-black transition">
        Send
      </button>

      <a href="https://www.instagram.com/remister35mm/" class="text-1xl text-center mb-10 hover:cursor-pointer">Alternatively contact me on Instagram @remister35mm</a>

    </form>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white py-8 text-center text-sm flex flex-col">
    <p class="my-1 text-black">© 2026 Remy Kassim Photography. All rights reserved.</p>
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=r.m.kasym@gmail.com&su=Photography%20enquiry"
     target="_blank" rel="noopener" class="text-black">Email me : r.m.kasym@gmail.com</a>
    <a href="https://www.instagram.com/remister35mm/" class="my-1 text-1xl hover:cursor-pointer text-black">Instagram : @remister35mm</a>
  </footer>

  <!-- SMOOTH SCROLL -->
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script>
    const lenis = new Lenis({
      lerp: 0.10,
      anchors: true
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  </script>

</body>
</html>
