name: Sync Docs to SharePoint

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sync-docs-to-sharepoint.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (preview changes without modifying SharePoint)'
        required: false
        default: true
        type: boolean

concurrency:
  group: sync-docs-sharepoint
  cancel-in-progress: false

jobs:
  sync-docs:
    name: Sync ./docs to SharePoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Source Directory
        run: |
          if [ ! -d "./docs" ]; then
            echo "::error::Source directory './docs' not found in workspace."
            exit 1
          fi
          echo "Source directory './docs' exists. File count:"
          find ./docs -type f | wc -l

      - name: Execute SharePoint Sync
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          AZURE_ACCESS_TOKEN: ${{ secrets.AZURE_ACCESS_TOKEN }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FOLDER_PATH: ${{ secrets.SHAREPOINT_FOLDER_PATH }}
          SOURCE_DIR: './docs'
          # If triggered via workflow_dispatch, respect input. If triggered via push, run live.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          echo "Starting Microsoft Graph API Documentation Sync..."
          echo "Trigger event: ${{ github.event_name }}"
          echo "Dry run mode : $DRY_RUN"
          
          python scripts/sync_docs_to_sharepoint.py
